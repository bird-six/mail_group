<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';"><title>邮件群发助手</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#233248;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}.bar{height:42px;background:#172230;color:#eef3f9;display:flex;align-items:center;padding:0 22px;font-size:12px;-webkit-app-region:drag}.content{min-height:calc(100vh - 42px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}.icon{width:56px;height:56px;border:1px solid #cfd9e5;border-radius:15px;display:grid;place-items:center;color:#52749a;font-size:30px}h1{font-size:23px;font-weight:600;margin:24px 0 8px}p{color:#6a7e94;max-width:420px;text-align:center;line-height:1.8}.progress{width:180px;height:3px;background:#dce4ee;border-radius:9px;margin:20px;overflow:hidden}.progress:after{content:'';display:block;width:70px;height:100%;background:#6389b1;animation:load 1.5s ease-in-out infinite}@keyframes load{from{transform:translateX(-70px)}to{transform:translateX(180px)}}@media(prefers-reduced-motion:reduce){.progress:after{animation:none;width:100%}}
.bar{padding-right:0;justify-content:space-between}.actions{display:flex;height:100%;-webkit-app-region:no-drag}.actions button{border:0;background:transparent;color:inherit;width:46px;font-size:18px;cursor:pointer}.actions button:hover{background:#304155}.actions button:last-child:hover{background:#c93642}
</style></head><body><div class="bar"><span>邮件群发助手 · 桌面版</span><div class="actions"><button data-action="minimize" aria-label="最小化">−</button><button data-action="close" aria-label="关闭窗口">×</button></div></div><main class="content"><div class="icon">✉</div><h1>邮件群发助手</h1><p class="message">正在准备本地工作区，请稍候。<br>邮箱配置、邮件模板和发送记录保存在这台电脑上。</p><div class="progress" role="progressbar" aria-label="正在准备"></div></main><script src="loading.js"></script></body></html>
